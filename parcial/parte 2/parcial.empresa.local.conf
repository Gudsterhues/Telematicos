<VirtualHost *:80>
    ServerName parcial.empresa.local
    DocumentRoot /var/www/html/parcial

    <Directory /var/www/html/parcial>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- Configuración mod_deflate (Gzip) ---
    <IfModule mod_deflate.c>
        # Probar cambiando a 1, 6 y 9 para las mediciones
        DeflateCompressionLevel 6

        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json image/svg+xml
    </IfModule>

    # --- Configuración mod_brotli ---
    <IfModule mod_brotli.c>
        # Probar cambiando a 5 y 11 para las mediciones
        BrotliCompressionQuality 5
        BrotliCompressionWindow 22

        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css application/javascript application/json image/svg+xml
    </IfModule>

    # EXCLUSIÓN ESTRICTA: Evita comprimir archivos binarios/multimedia ya comprimidos
    SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$" no-gzip dont-vary
    SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$" no-brotli

    ErrorLog ${APACHE_LOG_DIR}/parcial_error.log
    CustomLog ${APACHE_LOG_DIR}/parcial_access.log combined
</VirtualHost>
