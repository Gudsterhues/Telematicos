<IfModule mod_deflate.c>
    # Punto 4: Nivel de compresión. 
    # Empezaremos midiendo el 6 (medio). Luego cambiarás este número a 1 y 9 para tus pruebas.
    DeflateCompressionLevel 9

    # Punto 3: Aplicar compresión por tipo MIME a contenido de texto
    AddOutputFilterByType DEFLATE text/html text/plain text/xml \
                                  text/css application/javascript application/json image/svg+xml

    # Punto 5: Excluir de la compresión los tipos ya comprimidos (imágenes, video, empaquetados)
    SetEnvIfNoCase Request_URI \.(?:gif|jpeg|png|webp|mp4|avi|zip|gz|pdf)$ \
    no-gzip dont-vary
</IfModule>
